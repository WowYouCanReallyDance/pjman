[package]
name = "pjman"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
# 默认仅启用 SQLite；外部数据库驱动按需开启
db-mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
db-postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
# 异步运行时
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "process"] }
# ORM（默认 SQLite，经 cargo feature 接入 mysql/postgres）
sea-orm = { version = "2", features = [
    "macros",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "with-chrono",
    "with-uuid",
] }
sea-orm-migration = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
# 标识与时间
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误处理
thiserror = "2"
anyhow = "1"
# 平台与交互
dirs = "6"
dialoguer = "0.12"
comfy-table = "7"
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
